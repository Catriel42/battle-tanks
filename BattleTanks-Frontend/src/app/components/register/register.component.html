<div class="auth-container">
  <div class="auth-panel">
    <h1 class="auth-title">Battle Tanks</h1>
    <p class="auth-subtitle">Enlistment Form</p>
    
    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input 
          type="text" 
          id="username"
          [(ngModel)]="username" 
          name="username" 
          required 
          autocomplete="off" 
          placeholder="Choose callsign..."
        />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input 
          type="email" 
          id="email"
          [(ngModel)]="email" 
          name="email" 
          required 
          autocomplete="off" 
          placeholder="Enter email..."
        />
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password"
          [(ngModel)]="password" 
          name="password" 
          required 
          placeholder="Set password..."
        />
      </div>
      
      @if (errorMsg()) {
        <div class="error-box">{{ errorMsg() }}</div>
      }
      @if (successMsg()) {
        <div class="success-box">{{ successMsg() }}</div>
      }
      
      <button type="submit" class="btn-primary" [disabled]="isLoading()">
        @if (isLoading()) {
          Processing...
        } @else {
          Create Account
        }
      </button>
    </form>
    
    <div class="auth-footer">
      <p>Already enlisted? <a routerLink="/login">Login here</a></p>
    </div>
  </div>
</div>
