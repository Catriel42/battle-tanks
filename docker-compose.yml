services:
  api:
    build:
      context: ./BattleTanks-Backend
      dockerfile: Dockerfile
      network: host 
    container_name: battletanks-api
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:5000
      - Jwt__Secret=SuperSecretKeyForBattleTanksApiWhichNeedsToBeAtLeast32BytesLong!
      - Jwt__Issuer=BattleTanksBackend
      - Jwt__Audience=BattleTanksFrontend
      - ConnectionStrings__PrimaryConnection=Host=postgres-primary;Port=5432;Database=battletanks;Username=battletanks;Password=battletanks;Pooling=true;MinPoolSize=5;MaxPoolSize=100;ConnectionIdleLifetime=300;ConnectionPruningInterval=10
      - ConnectionStrings__ReplicaConnection=Host=postgres-replica;Port=5432;Database=battletanks;Username=battletanks;Password=battletanks;Pooling=true;MinPoolSize=2;MaxPoolSize=50;ConnectionIdleLifetime=300;ConnectionPruningInterval=10
      - ConnectionStrings__Redis=redis:6379
      - Mqtt__Host=emqx
      - Mqtt__Port=1883
      - Mqtt__UseTls=false
    depends_on:
      postgres-primary:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
      redis:
        condition: service_started
      emqx:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================
  # Nginx Reverse Proxy (WebSockets, SignalR & API Gateway)
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: battletanks-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - emqx


  postgres-primary:
    image: postgres:18
    container_name: battletanks-postgres-primary
    restart: unless-stopped
    environment:
      POSTGRES_USER: battletanks
      POSTGRES_PASSWORD: battletanks
      POSTGRES_DB: battletanks
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5432:5432"
    volumes:
      - postgres_primary_data:/var/lib/postgresql
      - ./docker/postgres/primary-init.sh:/docker-entrypoint-initdb.d/init-replication.sh
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=3
      -c max_replication_slots=3
      -c hot_standby=on
      -c listen_addresses='*'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U battletanks -d battletanks"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-replica:
    image: postgres:18
    container_name: battletanks-postgres-replica
    restart: unless-stopped
    environment:
      POSTGRES_USER: battletanks
      POSTGRES_PASSWORD: battletanks
      POSTGRES_DB: battletanks
      PGUSER: battletanks
      PGPASSWORD: battletanks
      PGDATA: /var/lib/postgresql/18/main
    ports:
      - "5433:5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql
      - ./docker/postgres/replica-entrypoint.sh:/replica-entrypoint.sh
    depends_on:
      postgres-primary:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/replica-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U battletanks -d battletanks"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: battletanks-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@battletanks.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8081:80"
    depends_on:
      - postgres-primary
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  redis:
    image: redis:8
    container_name: battletanks-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  emqx:
    image: emqx/emqx:5.8
    container_name: battletanks-emqx
    restart: unless-stopped
    environment:
      EMQX_NAME: battletanks-broker
      EMQX_HOST: node1.emqx.local
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: public
    ports:
      - "1883:1883"
      - "8083:8083"
      - "18083:18083"
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log

  influxdb:
    image: influxdb:1.8
    container_name: battletanks-influxdb
    restart: unless-stopped
    environment:
      INFLUXDB_DB: k6
      INFLUXDB_HTTP_AUTH_ENABLED: "false"
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb

  grafana:
    image: grafana/grafana:11.4.0
    container_name: battletanks-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: battletanks
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - influxdb

volumes:
  postgres_primary_data:
  postgres_replica_data:
  pgadmin_data:
  redis_data:
  emqx_data:
  emqx_log:
  influxdb_data:
  grafana_data:
